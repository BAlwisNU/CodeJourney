name: CI

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # Pinned to match Pyodide's CPython. See docs/architecture.md.
        with: {python-version: "3.12"}
      - run: pip install -e "apps/api[dev]"
      # No database needed: tests run against SQLite (see tests/conftest.py), so
      # this stays in CI's fast path.
      - run: pytest apps/api/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
