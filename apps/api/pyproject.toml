[project]
name = "codejourney-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    # [crypto] pulls in `cryptography`, needed only for Apple: its client secret
    # is an ES256-signed JWT we generate, not a string Apple gives us.
    "pyjwt[crypto]>=2.9",
    # Apple returns its result as an HTML form POST, and FastAPI cannot read a
    # form body without this.
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    # Server-to-server calls to Google's and Microsoft's OAuth endpoints. A
    # runtime dependency now, not just a test one: app/oauth.py needs it
    # whenever a sign-in button is configured.
    "httpx>=0.27",
    # The reflection tutor. Optional at runtime -- with no ANTHROPIC_API_KEY the
    # tutor endpoints degrade to a friendly note and this is never imported.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
